# Déploie ns-mathismottetpro-beauval-en-caux/beauval à chaque push sur main.
name: Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: codable-deploy-ns-mathismottetpro-beauval-en-caux-beauval
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  IMAGE: images.saas-depoy.com/clients/mathismottetpro/beauval-en-caux-beauval
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker buildx build --platform linux/amd64 --provenance=false --load -t "$IMAGE:$GITHUB_SHA" .
      - name: Push
        run: |
          TOKEN=$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fapi.saas-depoy.com" | jq -r .value)
          echo "$TOKEN" | docker login images.saas-depoy.com -u github-actions --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy
        run: |
          TOKEN=$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fapi.saas-depoy.com" | jq -r .value)
          curl -sS --fail-with-body --retry 5 --retry-connrefused -X POST https://api.saas-depoy.com/api/v1/deploy \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"namespace\":\"ns-mathismottetpro-beauval-en-caux\",\"component\":\"beauval\",\"image\":\"$IMAGE:$GITHUB_SHA\"}"
